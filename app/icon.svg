<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    SVG favicon with a colour-scheme switch. A fixed dark mark disappears
    against a dark browser chrome, and a fixed light one disappears against a
    light one, so the media query is the only way one file serves both.
  -->
  <style>
    .m { stroke: #1a1c1d }
    @media (prefers-color-scheme: dark) { .m { stroke: #f2efe8 } }
  </style>
  <g class="m" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="84" height="84" rx="25" />
    <path d="M 23 40 V 64 q 0 10.5 9 10.5 q 9 0 9 -10.5 V 36 q 0 -10.5 9 -10.5 q 9 0 9 10.5 V 64 q 0 10.5 9 10.5 q 9 0 9 -10.5 V 40" />
  </g>
</svg>
